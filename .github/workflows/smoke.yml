name: smoke

# CPU-only code checks and bundled MicroPool manifest tests; no data download.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU-only dependencies
        run: |
          # requirements.txt pins the CUDA build used for training; CI installs
          # the CPU wheels plus the runtime deps needed by the code paths below.
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install ftfy regex tqdm webdataset braceexpand pillow

      - name: Smoke test (code paths)
        run: bash scripts/smoke_test.sh

      - name: MicroPool release tests
        run: python -m unittest discover -s MicroPool/tests -v

      - name: Validate static project page
        run: |
          node docs/tools/check-site.mjs
          node --check docs/script.js
